<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div>
        <p class="eyebrow">Sudoku</p>
        <h1>Complete o tabuleiro</h1>
      </div>
      <label class="difficulty">
        Dificuldade
        <select id="difficulty">
          <option value="easy">Fácil</option>
          <option value="medium">Médio</option>
          <option value="hard">Difícil</option>
        </select>
      </label>
    </header>

    <section class="board-shell" aria-label="Tabuleiro de Sudoku">
      <div id="board" class="board"></div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">
      Selecione uma casa vazia e digite um número de 1 a 9.
    </div>

    <section class="controls" aria-label="Controles do jogo">
      <div id="number-pad" class="number-pad">
        <button type="button" data-number="1">1</button>
        <button type="button" data-number="2">2</button>
        <button type="button" data-number="3">3</button>
        <button type="button" data-number="4">4</button>
        <button type="button" data-number="5">5</button>
        <button type="button" data-number="6">6</button>
        <button type="button" data-number="7">7</button>
        <button type="button" data-number="8">8</button>
        <button type="button" data-number="9">9</button>
      </div>
      <button id="clear" class="clear-button" type="button">Limpar casa</button>
      <button id="restart" class="restart-button" type="button">Novo jogo</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
